<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RestroBar</title>
  <meta name="description" content="Restaurant ordering, kitchen display and billing that works offline.">
  <meta name="theme-color" content="#1F7A5A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RestroBar">
  <link rel="manifest" href="manifest.webmanifest?v=0.1.0">
  <link rel="icon" href="icons/icon.svg?v=0.1.0" type="image/svg+xml">
  <link rel="icon" href="icons/favicon.ico?v=0.1.0" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=0.1.0">
  <link rel="stylesheet" href="css/app.css?v=0.1.0">
</head>
<body>
  <div id="splash" aria-hidden="true"><img class="mark" src="icons/icon.svg?v=0.1.0" alt=""></div>
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:16px">RestroBar needs JavaScript turned on.</p></noscript>

  <!-- Load order matters: libraries, core, ui, features, app (boots last). tests/structure.test.mjs checks it. -->
  <script src="lib/qrcode-1.4.4.js?v=0.1.0"></script>
  <script src="lib/jsQR-1.4.0.js?v=0.1.0"></script>
  <script src="js/core/version.js?v=0.1.0"></script>
  <script src="js/core/util.js?v=0.1.0"></script>
  <script src="js/core/i18n.js?v=0.1.0"></script>
  <script src="js/core/billing.js?v=0.1.0"></script>
  <script src="js/core/store.js?v=0.1.0"></script>
  <script src="js/ui/ui.js?v=0.1.0"></script>
  <script src="js/features/qr.js?v=0.1.0"></script>
  <script src="js/features/share.js?v=0.1.0"></script>
  <script src="js/features/link.js?v=0.1.0"></script>
  <script src="js/features/setup.js?v=0.1.0"></script>
  <script src="js/features/tables.js?v=0.1.0"></script>
  <script src="js/features/order.js?v=0.1.0"></script>
  <script src="js/features/kitchen.js?v=0.1.0"></script>
  <script src="js/features/bill.js?v=0.1.0"></script>
  <script src="js/features/menu.js?v=0.1.0"></script>
  <script src="js/features/reports.js?v=0.1.0"></script>
  <script src="js/features/settings.js?v=0.1.0"></script>
  <script src="js/app.js?v=0.1.0"></script>
</body>
</html>
