name: Report a problem
description: Something broke or gave a wrong number.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Please do not paste real customer or sales data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you tap, step by step?
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: role
    attributes:
      label: Device role
  - type: input
    id: version
    attributes:
      label: App version
  - type: input
    id: device
    attributes:
      label: Device and browser
